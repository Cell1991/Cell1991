<svg width="100%" height="100%" viewBox="0 0 860 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="strokeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b18" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <style>
      @keyframes flowAnimation {
        to {
          stroke-dashoffset: -20;
        }
      }
      .ai-stream {
        stroke-dasharray: 6, 4;
        animation: flowAnimation 1s linear infinite;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="860" height="200" rx="12" fill="url(#strokeBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Window Bar -->
  <rect x="0" y="0" width="860" height="34" rx="12" fill="#0f172a" />
  <circle cx="20" cy="17" r="4.5" fill="#ef4444" />
  <circle cx="36" cy="17" r="4.5" fill="#f59e0b" />
  <circle cx="52" cy="17" r="4.5" fill="#22c55e" />
  <text x="74" y="21" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#cbd5e1">MEDICAL AI INFERENCE PIPELINE &amp; SEGMENTATION ARCHITECTURE</text>

  <!-- Step 1: Medical Upload -->
  <g transform="translate(25, 55)">
    <rect width="175" height="120" rx="8" fill="#0b1329" stroke="url(#blueGlow)" stroke-width="1.5" />
    <text x="87.5" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#38bdf8">◈ Medical Scans</text>
    <text x="87.5" y="55" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">DICOM / PNG Ingestion</text>
    <text x="87.5" y="78" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">• Normalization Matrix</text>
    <text x="87.5" y="96" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">• Dimension Rescaling</text>
  </g>

  <!-- Connection 1 -> 2 -->
  <path d="M 200 115 L 245 115" stroke="#38bdf8" stroke-width="2" class="ai-stream" />
  <polygon points="250,115 240,110 240,120" fill="#38bdf8" />

  <!-- Step 2: FastAPI + ONNX Runtime -->
  <g transform="translate(255, 55)">
    <rect width="200" height="120" rx="8" fill="#0b1329" stroke="url(#purpleGlow)" stroke-width="1.5" />
    <text x="100" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#c084fc">✦ ONNX Runtime</text>
    <text x="100" y="55" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">FastAPI Microservice</text>
    <text x="100" y="78" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">• Low-Latency Inference</text>
    <text x="100" y="96" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">• Tensor Compute Worker</text>
  </g>

  <!-- Connection 2 -> 3 -->
  <path d="M 455 115 L 500 115" stroke="#c084fc" stroke-width="2" class="ai-stream" />
  <polygon points="505,115 495,110 495,120" fill="#c084fc" />

  <!-- Step 3: Segmentation Mask -->
  <g transform="translate(510, 55)">
    <rect width="155" height="120" rx="8" fill="#0b1329" stroke="url(#greenGlow)" stroke-width="1.5" />
    <text x="77.5" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#4ade80">⬡ Mask Engine</text>
    <text x="77.5" y="55" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Clinical Overlays</text>
    <text x="77.5" y="78" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">• Stroke Segmentation</text>
    <text x="77.5" y="96" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">• Confidence Scoring</text>
  </g>

  <!-- Connection 3 -> 4 -->
  <path d="M 665 115 L 705 115" stroke="#4ade80" stroke-width="2" class="ai-stream" />
  <polygon points="710,115 700,110 700,120" fill="#4ade80" />

  <!-- Step 4: Next.js Clinical UI -->
  <g transform="translate(715, 55)">
    <rect width="125" height="120" rx="8" fill="#0b1329" stroke="url(#blueGlow)" stroke-width="1.5" />
    <text x="62.5" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">⬢ Next.js</text>
    <text x="62.5" y="55" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Clinical UI</text>
    <text x="62.5" y="78" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">• Interactive</text>
    <text x="62.5" y="96" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">• Realtime View</text>
  </g>

</svg>
