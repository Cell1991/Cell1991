<svg width="100%" height="100%" viewBox="0 0 860 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Card Background -->
    <linearGradient id="sprintBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060914" />
      <stop offset="50%" stop-color="#090f22" />
      <stop offset="100%" stop-color="#0d162d" />
    </linearGradient>

    <!-- Outer Cyber Border -->
    <linearGradient id="sprintBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Node Gradients -->
    <linearGradient id="glowMax" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#39d353" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .font-ui {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      }
      @keyframes snakeGlider {
        0% { transform: translate(0, 0); }
        25% { transform: translate(80px, 0); }
        50% { transform: translate(80px, 34px); }
        75% { transform: translate(160px, 34px); }
        100% { transform: translate(160px, 68px); }
      }
      @keyframes radarPulse {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.05); }
      }
      .snake-crawl {
        animation: snakeGlider 5s ease-in-out infinite alternate;
      }
      .radar-line {
        animation: radarPulse 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="860" height="220" rx="14" fill="url(#sprintBg)" stroke="url(#sprintBorder)" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <rect x="0" y="0" width="860" height="34" rx="14" fill="#0f172a" />
  <circle cx="20" cy="17" r="4.5" fill="#ef4444" />
  <circle cx="36" cy="17" r="4.5" fill="#f59e0b" />
  <circle cx="52" cy="17" r="4.5" fill="#22c55e" />
  <text x="74" y="22" class="font-ui" font-size="12" font-weight="700" fill="#cbd5e1" letter-spacing="0.5">ACTIVE ENGINEERING SPRINT // RECENT 60-DAY RADAR</text>
  <text x="780" y="22" text-anchor="end" class="font-ui" font-size="11" font-weight="700" fill="#00f2fe">505+ CONTRIBUTIONS</text>

  <!-- LEFT PANEL: 60-DAY HIGH-DENSITY CONTRIBUTION GRID (Width: 490) -->
  <g transform="translate(25, 48)">
    <rect width="490" height="152" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
    
    <!-- Header Inside Left Panel -->
    <text x="16" y="22" class="font-ui" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.5">✦ LAST 60 DAYS ACTIVITY MATRIX</text>
    <text x="474" y="22" text-anchor="end" class="font-ui" font-size="10" fill="#94a3b8">Aug ➔ Present</text>

    <!-- Week Labels -->
    <g transform="translate(45, 38)" class="font-ui" font-size="9.5" fill="#64748b" font-weight="600">
      <text x="0">W1</text>
      <text x="45">W2</text>
      <text x="90">W3</text>
      <text x="135">W4</text>
      <text x="180">W5</text>
      <text x="225">W6</text>
      <text x="270">W7</text>
      <text x="315">W8</text>
      <text x="360" fill="#00f2fe">W9 (Active)</text>
    </g>

    <!-- Day Labels (Left) -->
    <g transform="translate(14, 58)" class="font-ui" font-size="9" fill="#64748b" font-weight="600">
      <text y="0">Mon</text>
      <text y="34">Wed</text>
      <text y="68">Fri</text>
    </g>

    <!-- Matrix Nodes Grid (Dense 9 Weeks x 7 Days) -->
    <g transform="translate(45, 48)">
      <!-- Day 1 (Mon) -->
      <g transform="translate(0, 0)">
        <rect x="0" width="14" height="14" rx="3" fill="#006d32" />
        <rect x="45" width="14" height="14" rx="3" fill="#0e4429" />
        <rect x="90" width="14" height="14" rx="3" fill="#26a641" />
        <rect x="135" width="14" height="14" rx="3" fill="#006d32" />
        <rect x="180" width="14" height="14" rx="3" fill="#26a641" />
        <rect x="225" width="14" height="14" rx="3" fill="#39d353" />
        <rect x="270" width="14" height="14" rx="3" fill="#26a641" />
        <rect x="315" width="14" height="14" rx="3" fill="#39d353" />
        <rect x="360" width="14" height="14" rx="3" fill="url(#glowMax)" filter="url(#nodeGlow)" />
      </g>

      <!-- Day 2 (Tue) -->
      <g transform="translate(0, 17)">
        <rect x="0" width="14" height="14" rx="3" fill="#0e4429" />
        <rect x="45" width="14" height="14" rx="3" fill="#006d32" />
        <rect x="90" width="14" height="14" rx="3" fill="#26a641" />
        <rect x="135" width="14" height="14" rx="3" fill="#26a641" />
        <rect x="180" width="14" height="14" rx="3" fill="#39d353" />
        <rect x="225" width="14" height="14" rx="3" fill="#006d32" />
        <rect x="270" width="14" height="14" rx="3" fill="#39d353" />
        <rect x="315" width="14" height="14" rx="3" fill="#26a641" />
        <rect x="360" width="14" height="14" rx="3" fill="url(#glowMax)" filter="url(#nodeGlow)" />
      </g>

      <!-- Day 3 (Wed) -->
      <g transform="translate(0, 34)">
        <rect x="0" width="14" height="14" rx="3" fill="#006d32" />
        <rect x="45" width="14" height="14" rx="3" fill="#26a641" />
        <rect x="90" width="14" height="14" rx="3" fill="#39d353" />
        <rect x="135" width="14" height="14" rx="3" fill="#006d32" />
        <rect x="180" width="14" height="14" rx="3" fill="#26a641" />
        <rect x="225" width="14" height="14" rx="3" fill="#39d353" />
        <rect x="270" width="14" height="14" rx="3" fill="#39d353" />
        <rect x="315" width="14" height="14" rx="3" fill="#39d353" />
        <rect x="360" width="14" height="14" rx="3" fill="url(#glowMax)" filter="url(#nodeGlow)" />
      </g>

      <!-- Day 4 (Thu) -->
      <g transform="translate(0, 51)">
        <rect x="0" width="14" height="14" rx="3" fill="#0e4429" />
        <rect x="45" width="14" height="14" rx="3" fill="#006d32" />
        <rect x="90" width="14" height="14" rx="3" fill="#26a641" />
        <rect x="135" width="14" height="14" rx="3" fill="#39d353" />
        <rect x="180" width="14" height="14" rx="3" fill="#006d32" />
        <rect x="225" width="14" height="14" rx="3" fill="#26a641" />
        <rect x="270" width="14" height="14" rx="3" fill="#39d353" />
        <rect x="315" width="14" height="14" rx="3" fill="url(#glowMax)" />
        <rect x="360" width="14" height="14" rx="3" fill="url(#glowMax)" filter="url(#nodeGlow)" />
      </g>

      <!-- Day 5 (Fri) -->
      <g transform="translate(0, 68)">
        <rect x="0" width="14" height="14" rx="3" fill="#006d32" />
        <rect x="45" width="14" height="14" rx="3" fill="#26a641" />
        <rect x="90" width="14" height="14" rx="3" fill="#006d32" />
        <rect x="135" width="14" height="14" rx="3" fill="#26a641" />
        <rect x="180" width="14" height="14" rx="3" fill="#39d353" />
        <rect x="225" width="14" height="14" rx="3" fill="#26a641" />
        <rect x="270" width="14" height="14" rx="3" fill="#39d353" />
        <rect x="315" width="14" height="14" rx="3" fill="url(#glowMax)" />
        <rect x="360" width="14" height="14" rx="3" fill="url(#glowMax)" filter="url(#nodeGlow)" />
      </g>

      <!-- ANIMATED CYBER SNAKE GLIDING -->
      <g class="snake-crawl" filter="url(#nodeGlow)">
        <rect x="180" y="0" width="14" height="14" rx="3" fill="#00f2fe" opacity="0.3" />
        <rect x="225" y="0" width="14" height="14" rx="3" fill="#00f2fe" opacity="0.7" />
        <rect x="270" y="0" width="14" height="14" rx="4" fill="#38bdf8" />
        <!-- Head -->
        <rect x="315" y="0" width="15" height="15" rx="4" fill="#ffffff" stroke="#00f2fe" stroke-width="1.5" />
        <circle cx="320" cy="5" r="1.5" fill="#030712" />
        <circle cx="320" cy="10" r="1.5" fill="#030712" />
      </g>
    </g>
  </g>

  <!-- RIGHT PANEL: ACTIVITY RADAR & CODEBASE TELEMETRY (Width: 300) -->
  <g transform="translate(530, 48)">
    <rect width="305" height="152" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
    
    <text x="16" y="22" class="font-ui" font-size="11" font-weight="700" fill="#22c55e" letter-spacing="0.5">✦ ACTIVITY OVERVIEW RADAR</text>

    <!-- Crosshair Quadrant from Real GitHub Profile -->
    <g transform="translate(150, 85)">
      <!-- Axes -->
      <line x1="-70" y1="0" x2="70" y2="0" stroke="#1e293b" stroke-width="1.5" />
      <line x1="0" y1="-45" x2="0" y2="45" stroke="#1e293b" stroke-width="1.5" />

      <!-- Labels -->
      <text x="0" y="-50" text-anchor="middle" class="font-ui" font-size="8.5" fill="#94a3b8">Code review</text>
      <text x="76" y="3" text-anchor="start" class="font-ui" font-size="8.5" fill="#64748b">Issues</text>
      <text x="0" y="56" text-anchor="middle" class="font-ui" font-size="8.5" fill="#64748b">Pull requests (1%)</text>
      
      <!-- Commits Line (99%) Glowing -->
      <line x1="0" y1="0" x2="-62" y2="0" stroke="#22c55e" stroke-width="2.5" class="radar-line" />
      <circle cx="-62" cy="0" r="4" fill="#39d353" filter="url(#nodeGlow)" />
      <text x="-68" y="-5" text-anchor="end" class="font-ui" font-size="10" font-weight="700" fill="#22c55e">99% Commits</text>
      <circle cx="0" cy="0" r="3" fill="#00f2fe" />
    </g>

    <!-- Sub-info -->
    <g transform="translate(16, 138)" class="font-ui" font-size="10">
      <text fill="#94a3b8">Primary: <tspan fill="#38bdf8">crossword</tspan> • <tspan fill="#c084fc">nu-stroke</tspan> • <tspan fill="#34d399">wellness</tspan></text>
    </g>
  </g>

</svg>
