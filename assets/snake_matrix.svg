<svg width="100%" height="100%" viewBox="0 0 860 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gridBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060914" />
      <stop offset="50%" stop-color="#0a1024" />
      <stop offset="100%" stop-color="#0e172e" />
    </linearGradient>

    <!-- Glowing Frame -->
    <linearGradient id="gridBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.85" />
    </linearGradient>

    <!-- Snake Glow Filter -->
    <filter id="snakeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes snakeMove {
        0% { transform: translate(0, 0); }
        25% { transform: translate(140px, 0); }
        50% { transform: translate(140px, 36px); }
        75% { transform: translate(280px, 36px); }
        100% { transform: translate(280px, 72px); }
      }
      @keyframes dotPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.9); }
      }
      .snake-head {
        animation: snakeMove 6s ease-in-out infinite alternate;
      }
      .pulse-dot {
        animation: dotPulse 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card Container -->
  <rect width="860" height="210" rx="14" fill="url(#gridBg)" stroke="url(#gridBorder)" stroke-width="1.5" />

  <!-- Window Bar -->
