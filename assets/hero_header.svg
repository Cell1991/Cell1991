<svg width="100%" height="100%" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Obsidian & Cosmic Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#090e1d" />
      <stop offset="100%" stop-color="#0f1629" />
    </linearGradient>

    <!-- Radial Nebula Glows -->
    <radialGradient id="glowCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Text Shimmer Animation -->
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ffffff" />
      <animate attributeName="x1" from="-100%" to="100%" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="6s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Matrix Pattern -->
    <pattern id="cyberGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.35" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes laserScan {
        0% { transform: translateY(0); opacity: 0; }
        50% { opacity: 0.7; }
        100% { transform: translateY(240px); opacity: 0; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.85); }
      }
      .laser {
        animation: laserScan 4s linear infinite;
      }
      .live-pulse {
        animation: pulseDot 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base with Grid & Nebulas -->
  <rect width="900" height="240" rx="16" fill="url(#bgGradient)" />
  <rect width="900" height="240" rx="16" fill="url(#glowCyan)" />
  <rect width="900" height="240" rx="16" fill="url(#glowPurple)" />
  <rect width="900" height="240" rx="16" fill="url(#cyberGrid)" />

  <!-- Outer Neon Border Frame -->
  <rect x="1" y="1" width="898" height="238" rx="15" fill="none" stroke="url(#borderGlow)" stroke-width="1.5" />

  <!-- Corner Tech Geometry -->
  <path d="M 12 26 L 12 12 L 26 12" fill="none" stroke="#00f2fe" stroke-width="2.5" />
  <path d="M 874 12 L 888 12 L 888 26" fill="none" stroke="#a855f7" stroke-width="2.5" />
  <path d="M 12 214 L 12 228 L 26 228" fill="none" stroke="#00f2fe" stroke-width="2.5" />
  <path d="M 874 228 L 888 228 L 888 214" fill="none" stroke="#a855f7" stroke-width="2.5" />

  <!-- Animated Laser Scanline -->
  <line x1="20" y1="0" x2="880" y2="0" stroke="#00f2fe" stroke-width="1.5" opacity="0.4" class="laser" />

  <!-- Top Badges Row -->
  <g transform="translate(45, 34)">
    <rect width="132" height="24" rx="5" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
    <circle cx="14" cy="12" r="4" fill="#22c55e" class="live-pulse" />
    <text x="26" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">SYSTEM.ONLINE</text>
  </g>

  <g transform="translate(635, 34)">
    <rect width="220" height="24" rx="5" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
    <circle cx="14" cy="12" r="3.5" fill="#a855f7" />
    <text x="25" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#cbd5e1" letter-spacing="0.5">NARESUAN UNIVERSITY // CS</text>
  </g>

  <!-- Hero Name Display -->
  <text x="450" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="url(#textShimmer)" letter-spacing="3" filter="url(#softGlow)">
    THANAPHAT CHICHU
  </text>

  <!-- Role Subtitle -->
  <text x="450" y="145" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="600" fill="#38bdf8" letter-spacing="1.5">
    FULL STACK DEVELOPER // BACKEND &amp; CLOUD SYSTEMS ENGINEER
  </text>

  <!-- Interactive Stack Quick Bar -->
  <g transform="translate(45, 174)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="185" height="32" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
      <text x="92.5" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#f8fafc">✦ Next.js • React • TS</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(195, 0)">
      <rect width="195" height="32" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
      <text x="97.5" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#38bdf8">◈ FastAPI • Python Async</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(400, 0)">
      <rect width="200" height="32" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
      <text x="100" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#a855f7">⬡ PostgreSQL • Prisma</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(610, 0)">
      <rect width="200" height="32" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
      <text x="100" y="20" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#4ade80">⬢ Docker • AWS • Linux</text>
    </g>
  </g>
</svg>
