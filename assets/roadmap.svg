<svg width="100%" height="100%" viewBox="0 0 860 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="roadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b18" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="roadLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="33%" stop-color="#38bdf8" />
      <stop offset="66%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.85; }
      }
      .node-card {
        transition: transform 0.3s ease;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="860" height="130" rx="12" fill="url(#roadBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Connecting Beam -->
  <line x1="100" y1="65" x2="760" y2="65" stroke="url(#roadLine)" stroke-width="2" stroke-dasharray="6, 4" />

  <!-- Stage 1 -->
  <g transform="translate(20, 20)">
    <rect width="185" height="90" rx="8" fill="#0b1329" stroke="#00f2fe" stroke-width="1.2" />
    <circle cx="20" cy="22" r="5" fill="#00f2fe" />
    <text x="32" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00f2fe">01. DISTRIBUTED</text>
    <text x="15" y="52" font-family="-apple-system, sans-serif" font-size="11" fill="#e2e8f0">• Event-Driven Arch</text>
    <text x="15" y="72" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">• Kafka &amp; Redis Mesh</text>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(230, 20)">
    <rect width="185" height="90" rx="8" fill="#0b1329" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="20" cy="22" r="5" fill="#38bdf8" />
    <text x="32" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">02. CLOUD NATIVE</text>
    <text x="15" y="52" font-family="-apple-system, sans-serif" font-size="11" fill="#e2e8f0">• AWS Terraform IaC</text>
    <text x="15" y="72" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">• Container Fleets</text>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(440, 20)">
    <rect width="185" height="90" rx="8" fill="#0b1329" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="20" cy="22" r="5" fill="#a855f7" />
    <text x="32" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#a855f7">03. OBSERVABILITY</text>
    <text x="15" y="52" font-family="-apple-system, sans-serif" font-size="11" fill="#e2e8f0">• OpenTelemetry</text>
    <text x="15" y="72" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">• Prometheus &amp; Grafana</text>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(650, 20)">
    <rect width="185" height="90" rx="8" fill="#0b1329" stroke="#22c55e" stroke-width="1.2" />
    <circle cx="20" cy="22" r="5" fill="#22c55e" />
    <text x="32" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#22c55e">04. SECURE NET</text>
    <text x="15" y="52" font-family="-apple-system, sans-serif" font-size="11" fill="#e2e8f0">• Zero-Trust Architecture</text>
    <text x="15" y="72" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">• ACL &amp; Hardened Rules</text>
  </g>

</svg>
