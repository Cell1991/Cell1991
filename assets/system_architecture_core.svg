<svg width="100%" height="100%" viewBox="0 0 860 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="oopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060914" />
      <stop offset="50%" stop-color="#0a1024" />
      <stop offset="100%" stop-color="#0e172e" />
    </linearGradient>

    <!-- Glowing Borders -->
    <linearGradient id="borderCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="borderPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="borderEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="borderAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Outer Frame Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <style>
      @keyframes pulseLight {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .indicator {
        animation: pulseLight 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="860" height="240" rx="14" fill="url(#oopBg)" stroke="url(#frameGrad)" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="860" height="34" rx="14" fill="#0f172a" />
  <circle cx="20" cy="17" r="4.5" fill="#ef4444" />
  <circle cx="36" cy="17" r="4.5" fill="#f59e0b" />
  <circle cx="52" cy="17" r="4.5" fill="#22c55e" />
  <text x="74" y="21" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#cbd5e1">SOFTWARE DESIGN PATTERNS &amp; OOP ARCHITECTURAL PRINCIPLES</text>

  <!-- 4 Bento Feature Cards (2x2 Grid) -->

  <!-- CARD 1: Creational & Structural Patterns (Top Left) -->
  <g transform="translate(20, 48)">
    <rect width="395" height="80" rx="8" fill="#0b1329" stroke="url(#borderCyan)" stroke-width="1.2" />
    <circle cx="20" cy="20" r="4" fill="#00f2fe" class="indicator" />
    <text x="32" y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00f2fe">01 // Creational &amp; Structural</text>
    <text x="20" y="48" font-family="-apple-system, sans-serif" font-size="11" fill="#e2e8f0">• <b>Singleton Pattern:</b> DB Connection Pools &amp; Global State</text>
    <text x="20" y="66" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">• <b>Factory &amp; Interfaces:</b> Decoupled API Handlers &amp; Services</text>
  </g>

  <!-- CARD 2: Behavioral & Real-Time (Top Right) -->
  <g transform="translate(435, 48)">
    <rect width="405" height="80" rx="8" fill="#0b1329" stroke="url(#borderPurple)" stroke-width="1.2" />
    <circle cx="20" cy="20" r="4" fill="#c084fc" class="indicator" />
    <text x="32" y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#c084fc">02 // Behavioral &amp; Event-Driven</text>
    <text x="20" y="48" font-family="-apple-system, sans-serif" font-size="11" fill="#e2e8f0">• <b>Observer Pattern:</b> Real-time WebSocket Event Dispatch</text>
    <text x="20" y="66" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">• <b>Async Event Loop:</b> Non-blocking concurrency via FastAPI</text>
  </g>

  <!-- CARD 3: Relational Modeling & Repository (Bottom Left) -->
  <g transform="translate(20, 138)">
    <rect width="395" height="85" rx="8" fill="#0b1329" stroke="url(#borderEmerald)" stroke-width="1.2" />
    <circle cx="20" cy="20" r="4" fill="#34d399" class="indicator" />
    <text x="32" y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#34d399">03 // Data Integrity &amp; Repository</text>
    <text x="20" y="48" font-family="-apple-system, sans-serif" font-size="11" fill="#e2e8f0">• <b>Repository Pattern:</b> Prisma ORM Data Abstraction Layer</text>
    <text x="20" y="68" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">• <b>Normalized 3NF:</b> Strict schema design &amp; data dictionaries</text>
  </g>

  <!-- CARD 4: Zero-Trust & Gateway Contracts (Bottom Right) -->
  <g transform="translate(435, 138)">
    <rect width="405" height="85" rx="8" fill="#0b1329" stroke="url(#borderAmber)" stroke-width="1.2" />
    <circle cx="20" cy="20" r="4" fill="#fbbf24" class="indicator" />
    <text x="32" y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#fbbf24">04 // Security &amp; Isolation</text>
    <text x="20" y="48" font-family="-apple-system, sans-serif" font-size="11" fill="#e2e8f0">• <b>Contract Validation:</b> Pydantic &amp; TypeScript DTO typing</text>
    <text x="20" y="68" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">• <b>Layered Defense:</b> Docker container mesh &amp; Network ACLs</text>
  </g>

</svg>
