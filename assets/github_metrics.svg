<svg width="100%" height="100%" viewBox="0 0 860 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b18" />
      <stop offset="50%" stop-color="#0b1226" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="dashBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Language Bar Gradients -->
    <linearGradient id="pyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="tsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="sqlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <style>
      .font-ui {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="860" height="210" rx="12" fill="url(#dashBg)" stroke="url(#dashBorder)" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="860" height="34" rx="12" fill="#0f172a" />
  <circle cx="20" cy="17" r="4.5" fill="#ef4444" />
  <circle cx="36" cy="17" r="4.5" fill="#f59e0b" />
  <circle cx="52" cy="17" r="4.5" fill="#22c55e" />
  <text x="74" y="22" class="font-ui" font-size="12" font-weight="700" fill="#cbd5e1" letter-spacing="0.5">ENGINEERING METRICS &amp; ACTIVITY TELEMETRY COCKPIT</text>

  <!-- COLUMN 1: REPOSITORY & CODE DISCIPLINE (Width: 255) -->
  <g transform="translate(25, 52)">
    <rect width="255" height="138" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="26" class="font-ui" font-size="11.5" font-weight="700" fill="#00f2fe" letter-spacing="0.5">✦ REPOSITORY OVERVIEW</text>
    
    <!-- Row 1: Crossword -->
    <text x="16" y="53" class="font-ui" font-size="12" font-weight="600" fill="#e2e8f0">🎮 crossword-game</text>
    <g transform="translate(178, 41)">
      <rect width="64" height="18" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="0.8" />
      <text x="32" y="10" dominant-baseline="central" text-anchor="middle" class="font-ui" font-size="9.5" font-weight="700" fill="#38bdf8" letter-spacing="0.5">FASTAPI</text>
    </g>

    <!-- Row 2: Stroke Scan -->
    <text x="16" y="79" class="font-ui" font-size="12" font-weight="600" fill="#e2e8f0">🧠 nu-stroke-scan</text>
    <g transform="translate(184, 67)">
      <rect width="58" height="18" rx="4" fill="#a855f7" fill-opacity="0.2" stroke="#c084fc" stroke-width="0.8" />
      <text x="29" y="10" dominant-baseline="central" text-anchor="middle" class="font-ui" font-size="9.5" font-weight="700" fill="#c084fc" letter-spacing="0.5">ONNX</text>
    </g>

    <!-- Row 3: Wellness Platform -->
    <text x="16" y="105" class="font-ui" font-size="12" font-weight="600" fill="#e2e8f0">🩺 wellness-demo</text>
    <g transform="translate(180, 93)">
      <rect width="62" height="18" rx="4" fill="#059669" fill-opacity="0.2" stroke="#34d399" stroke-width="0.8" />
      <text x="31" y="10" dominant-baseline="central" text-anchor="middle" class="font-ui" font-size="9.5" font-weight="700" fill="#34d399" letter-spacing="0.5">PRISMA</text>
    </g>

    <!-- Row 4: Sub-info -->
    <text x="16" y="126" class="font-ui" font-size="10.5" fill="#64748b">⚡ Docker Containerized Mesh</text>
  </g>

  <!-- COLUMN 2: LANGUAGE & RUNTIME MATRIX (Width: 275) -->
  <g transform="translate(292, 52)">
    <rect width="275" height="138" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="26" class="font-ui" font-size="11.5" font-weight="700" fill="#818cf8" letter-spacing="0.5">📊 LANGUAGE DISTRIBUTION</text>

    <!-- Python -->
    <text x="16" y="50" class="font-ui" font-size="11.5" font-weight="500" fill="#cbd5e1">Python / FastAPI</text>
    <text x="258" y="50" text-anchor="end" class="font-ui" font-size="11" font-weight="700" fill="#00f2fe">42%</text>
    <rect x="16" y="56" width="242" height="6" rx="3" fill="#1e293b" />
    <rect x="16" y="56" width="102" height="6" rx="3" fill="url(#pyGrad)" />

    <!-- TypeScript / React -->
    <text x="16" y="78" class="font-ui" font-size="11.5" font-weight="500" fill="#cbd5e1">TypeScript / Next.js</text>
    <text x="258" y="78" text-anchor="end" class="font-ui" font-size="11" font-weight="700" fill="#818cf8">34%</text>
    <rect x="16" y="84" width="242" height="6" rx="3" fill="#1e293b" />
    <rect x="16" y="84" width="82" height="6" rx="3" fill="url(#tsGrad)" />

    <!-- SQL & PostgreSQL -->
    <text x="16" y="106" class="font-ui" font-size="11.5" font-weight="500" fill="#cbd5e1">PostgreSQL / Prisma</text>
    <text x="258" y="106" text-anchor="end" class="font-ui" font-size="11" font-weight="700" fill="#34d399">15%</text>
    <rect x="16" y="112" width="242" height="6" rx="3" fill="#1e293b" />
    <rect x="16" y="112" width="36" height="6" rx="3" fill="url(#sqlGrad)" />

    <!-- Cloud / Docker / Shell -->
    <text x="16" y="130" class="font-ui" font-size="10.5" fill="#64748b">Docker • Linux • Shell (9%)</text>
  </g>

  <!-- COLUMN 3: ACTIVITY VELOCITY & TELEMETRY (Width: 255) -->
  <g transform="translate(580, 52)">
    <rect width="255" height="138" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="26" class="font-ui" font-size="11.5" font-weight="700" fill="#34d399" letter-spacing="0.5">🔥 COMMIT VELOCITY</text>

    <!-- Dial / Metric -->
    <circle cx="58" cy="85" r="30" stroke="#1e293b" stroke-width="5.5" fill="none" />
    <circle cx="58" cy="85" r="30" stroke="url(#pyGrad)" stroke-width="5.5" fill="none" stroke-dasharray="150 190" stroke-linecap="round" />
    <text x="58" y="82" dominant-baseline="central" text-anchor="middle" class="font-ui" font-size="13.5" font-weight="800" fill="#f8fafc">550+</text>
    <text x="58" y="97" dominant-baseline="central" text-anchor="middle" class="font-ui" font-size="8.5" font-weight="600" fill="#94a3b8">COMMITS</text>

    <!-- Stats summary on the right of dial -->
    <g transform="translate(106, 52)">
      <text x="0" y="14" class="font-ui" font-size="11.5" font-weight="600" fill="#e2e8f0">Active Cadence</text>
      <text x="0" y="30" class="font-ui" font-size="9.5" font-weight="700" fill="#22c55e">● PRODUCTION READY</text>
      
      <text x="0" y="54" class="font-ui" font-size="11.5" font-weight="600" fill="#e2e8f0">Code Quality</text>
      <text x="0" y="70" class="font-ui" font-size="9.5" font-weight="700" fill="#38bdf8">100% TYPE-SAFE</text>
    </g>
  </g>

</svg>
