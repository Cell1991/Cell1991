<svg width="100%" height="100%" viewBox="0 0 900 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#090d1a" />
      <stop offset="100%" stop-color="#0e1424" />
    </linearGradient>

    <radialGradient id="nebulaCyan" cx="15%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaPurple" cx="85%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ffffff" />
      <animate attributeName="x1" from="-100%" to="100%" dur="7s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="7s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes scanline {
        0% { transform: translateY(0); opacity: 0; }
        50% { opacity: 0.6; }
        100% { transform: translateY(240px); opacity: 0; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .scan {
        animation: scanline 4s linear infinite;
      }
      .blinking {
        animation: blink 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Card Background -->
  <rect width="900" height="240" rx="16" fill="url(#bgGradient)" />
  <rect width="900" height="240" rx="16" fill="url(#nebulaCyan)" />
  <rect width="900" height="240" rx="16" fill="url(#nebulaPurple)" />
  <rect width="900" height="240" rx="16" fill="url(#grid)" />

  <!-- Outer Cyber Border -->
  <rect x="1" y="1" width="898" height="238" rx="15" fill="none" stroke="url(#borderGradient)" stroke-width="1.5" />

  <!-- Corner Tech Accents -->
  <!-- Top Left -->
  <path d="M 12 28 L 12 12 L 28 12" fill="none" stroke="#00f2fe" stroke-width="2.5" />
  <!-- Top Right -->
  <path d="M 872 12 L 888 12 L 888 28" fill="none" stroke="#a855f7" stroke-width="2.5" />
  <!-- Bottom Left -->
  <path d="M 12 212 L 12 228 L 28 228" fill="none" stroke="#00f2fe" stroke-width="2.5" />
  <!-- Bottom Right -->
  <path d="M 872 228 L 888 228 L 888 212" fill="none" stroke="#a855f7" stroke-width="2.5" />

  <!-- Laser Scanline Animation -->
  <line x1="20" y1="0" x2="880" y2="0" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" class="scan" />

  <!-- System Badge (Top Left) -->
  <g transform="translate(45, 36)">
    <rect x="0" y="0" width="130" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="12" cy="11" r="4" fill="#22c55e" class="blinking" />
    <text x="24" y="15" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">SYSTEM.ONLINE</text>
  </g>

  <!-- Institution Badge (Top Right) -->
  <g transform="translate(640, 36)">
    <rect x="0" y="0" width="215" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="12" cy="11" r="3" fill="#a855f7" />
    <text x="22" y="15" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" font-weight="600" fill="#cbd5e1" letter-spacing="0.5">NARESUAN UNIVERSITY // CS</text>
  </g>

  <!-- Main Name Header -->
  <text x="450" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="900" fill="url(#textShimmer)" letter-spacing="3" filter="url(#glow)">
    THANAPHAT CHICHU
  </text>

  <!-- Subtitle / Positioning -->
  <text x="450" y="145" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14.5" font-weight="600" fill="#38bdf8" letter-spacing="1.5">
    FULL STACK DEVELOPER // BACKEND &amp; CLOUD SYSTEMS ENGINEER
  </text>

  <!-- Tech Core Pills (Bottom Bar) -->
  <g transform="translate(45, 175)">
    <!-- Pill 1: Next.js + React -->
    <g transform="translate(0, 0)">
      <rect width="185" height="30" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
      <text x="92.5" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#e2e8f0">⚡ Next.js • React • TS</text>
    </g>

    <!-- Pill 2: FastAPI + Python -->
    <g transform="translate(195, 0)">
      <rect width="195" height="30" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
      <text x="97.5" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#38bdf8">⚙️ FastAPI • Python Async</text>
    </g>

    <!-- Pill 3: PostgreSQL + Prisma -->
    <g transform="translate(400, 0)">
      <rect width="200" height="30" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
      <text x="100" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#a855f7">🗄️ PostgreSQL • Prisma</text>
    </g>

    <!-- Pill 4: Docker + Cloud -->
    <g transform="translate(610, 0)">
      <rect width="200" height="30" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
      <text x="100" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#4ade80">☁️ Docker • AWS • Linux</text>
    </g>
  </g>

</svg>
