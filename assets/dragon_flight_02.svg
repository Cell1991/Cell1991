<svg width="100%" height="100%" viewBox="0 0 860 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="d2SpineGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="d2FinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0.2" />
    </linearGradient>

    <filter id="d2Glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="d2Spark" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes dragonGlide2 {
        0%, 100% { transform: translateY(0px) scaleY(1); }
        50% { transform: translateY(4px) scaleY(0.96); }
      }
      @keyframes clawGrip {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); filter: drop-shadow(0 0 6px #a855f7); }
      }
      .dragon-glide-2 {
        animation: dragonGlide2 5.5s ease-in-out infinite;
      }
      .claw-anim {
        transform-origin: 430px 38px;
        animation: clawGrip 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Dimension Orbit Grid Line -->
  <path d="M 60 35 Q 260 12 460 38 T 800 35" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 6" stroke-opacity="0.35" />

  <g class="dragon-glide-2">
    <!-- Serpentine Dragon Body (Coiling wave from Right to Left) -->
    <path d="M 820 35 Q 640 12 440 38 Q 240 62 40 35" fill="none" stroke="url(#d2SpineGrad)" stroke-width="7" stroke-linecap="round" filter="url(#d2Glow)" />
    <path d="M 820 35 Q 640 12 440 38 Q 240 62 40 35" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />

    <!-- Dorsal Fin Spikes -->
    <polygon points="730,22 716,2 710,24" fill="url(#d2FinGrad)" />
    <polygon points="660,18 644,0 638,20" fill="url(#d2FinGrad)" />
    <polygon points="580,22 566,4 560,25" fill="url(#d2FinGrad)" />
    
    <polygon points="360,46 344,66 338,44" fill="url(#d2FinGrad)" />
    <polygon points="290,52 274,70 268,50" fill="url(#d2FinGrad)" />
    <polygon points="210,50 196,68 190,48" fill="url(#d2FinGrad)" />
    <polygon points="140,42 128,58 122,40" fill="url(#d2FinGrad)" />

    <!-- Dragon Scale Light Nodes -->
    <g fill="#c084fc" filter="url(#d2Spark)">
      <circle cx="760" cy="27" r="2" />
      <circle cx="680" cy="20" r="2.2" />
      <circle cx="590" cy="24" r="2.5" />
      <circle cx="500" cy="32" r="2.5" />
      <circle cx="370" cy="46" r="2.5" />
      <circle cx="270" cy="52" r="2.2" />
      <circle cx="170" cy="46" r="2" />
    </g>

    <!-- ======================================================== -->
    <!-- ⚡ CYBER DRAGON CLAW GRASPING CORE (Center: x=410..470)  -->
    <!-- ======================================================== -->
    <g transform="translate(410, 20)" class="claw-anim">
      <!-- Energy Shield Ring -->
      <circle cx="20" cy="18" r="16" stroke="#a855f7" stroke-width="1" stroke-dasharray="3 3" fill="none" />
      <!-- Radiant Energy Core -->
      <circle cx="20" cy="18" r="7" fill="#00f2fe" filter="url(#d2Glow)" />
      <circle cx="20" cy="18" r="4" fill="#ffffff" />

      <!-- Dragon Claws / Talons (กรงเล็บมังกรไซเบอร์ 4 แฉก) -->
      <path d="M 6 4 Q 14 10 18 12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <path d="M 12 -2 Q 18 6 20 10" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <path d="M 28 -2 Q 22 6 20 10" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <path d="M 34 4 Q 26 10 22 12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      
      <!-- Talon Armor Knuckles -->
      <circle cx="8" cy="6" r="2" fill="#c084fc" />
      <circle cx="14" cy="0" r="2" fill="#c084fc" />
      <circle cx="26" cy="0" r="2" fill="#c084fc" />
      <circle cx="32" cy="6" r="2" fill="#c084fc" />
    </g>
  </g>
</svg>