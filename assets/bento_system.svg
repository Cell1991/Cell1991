<svg width="100%" height="100%" viewBox="0 0 860 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bentoCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>

    <linearGradient id="bentoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- 3-Column Bento Grid Container -->
  
  <!-- Bento Box 1: Identity & Core (Width: 270) -->
  <g transform="translate(0, 0)">
    <rect width="270" height="170" rx="10" fill="url(#bentoCardBg)" stroke="url(#bentoBorder)" stroke-width="1.2" />
    <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00f2fe">✦ IDENTITY &amp; CADENCE</text>
    
    <text x="20" y="60" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Thanaphat Chichu</text>
    <text x="20" y="80" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">@Cell1991 • B.Sc. CS</text>
    
    <rect x="20" y="100" width="230" height="1" fill="#1e293b" />
    
    <text x="20" y="125" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">🏛️ Naresuan University</text>
    <text x="20" y="148" font-family="-apple-system, sans-serif" font-size="11" fill="#4ade80">🟢 Status: Active Engineering</text>
  </g>

  <!-- Bento Box 2: Architecture & Focus (Width: 300) -->
  <g transform="translate(280, 0)">
    <rect width="290" height="170" rx="10" fill="url(#bentoCardBg)" stroke="url(#bentoBorder)" stroke-width="1.2" />
    <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">⚡ CORE ARCHITECTURES</text>
    
    <text x="20" y="62" font-family="-apple-system, sans-serif" font-size="11.5" fill="#e2e8f0">• Full-Stack Microservices</text>
    <text x="20" y="86" font-family="-apple-system, sans-serif" font-size="11.5" fill="#e2e8f0">• High-Throughput REST APIs</text>
    <text x="20" y="110" font-family="-apple-system, sans-serif" font-size="11.5" fill="#e2e8f0">• 3NF Relational Data Modeling</text>
    <text x="20" y="134" font-family="-apple-system, sans-serif" font-size="11.5" fill="#e2e8f0">• Multi-Container Orchestration</text>
  </g>

  <!-- Bento Box 3: Infrastructure & Systems (Width: 270) -->
  <g transform="translate(580, 0)">
    <rect width="280" height="170" rx="10" fill="url(#bentoCardBg)" stroke="url(#bentoBorder)" stroke-width="1.2" />
    <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#a855f7">🛸 INFRASTRUCTURE &amp; NET</text>
    
    <text x="20" y="62" font-family="-apple-system, sans-serif" font-size="11.5" fill="#e2e8f0">• Docker Compose &amp; AWS EC2</text>
    <text x="20" y="86" font-family="-apple-system, sans-serif" font-size="11.5" fill="#e2e8f0">• TCP/IP &amp; Cisco IOS Routing</text>
    <text x="20" y="110" font-family="-apple-system, sans-serif" font-size="11.5" fill="#e2e8f0">• Deep Packet Analysis (Wireshark)</text>
    <text x="20" y="134" font-family="-apple-system, sans-serif" font-size="11.5" fill="#e2e8f0">• ONNX Runtime Neural Inference</text>
  </g>
</svg>
