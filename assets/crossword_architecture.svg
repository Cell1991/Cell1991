<svg width="100%" height="100%" viewBox="0 0 860 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b18" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="nodeBorderCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="nodeBorderPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="nodeBorderGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <style>
      @keyframes dash {
        to {
          stroke-dashoffset: -20;
        }
      }
      .stream-line {
        stroke-dasharray: 6, 4;
        animation: dash 1s linear infinite;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="860" height="210" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Bar -->
  <rect x="0" y="0" width="860" height="34" rx="12" fill="#0f172a" />
  <circle cx="20" cy="17" r="4.5" fill="#ef4444" />
  <circle cx="36" cy="17" r="4.5" fill="#f59e0b" />
  <circle cx="52" cy="17" r="4.5" fill="#22c55e" />
  <text x="74" y="21" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#94a3b8">REAL-TIME MULTIPLAYER WEBSOCKET &amp; DISTRIBUTED ARCHITECTURE</text>

  <!-- Node 1: Client Application -->
  <g transform="translate(30, 60)">
    <rect width="180" height="115" rx="8" fill="#0b1329" stroke="url(#nodeBorderCyan)" stroke-width="1.5" />
    <text x="90" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#00f2fe">✦ Client UI</text>
    <text x="90" y="56" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Next.js / JavaScript ES6+</text>
    <text x="90" y="76" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">• Real-time Board Canvas</text>
    <text x="90" y="94" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">• Session State Sync</text>
  </g>

  <!-- Connection 1: Client <-> Gateway -->
  <path d="M 210 117 L 310 117" stroke="#38bdf8" stroke-width="2" class="stream-line" />
  <polygon points="315,117 305,112 305,122" fill="#38bdf8" />
  <polygon points="205,117 215,112 215,122" fill="#38bdf8" />
  <text x="260" y="106" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#38bdf8">WebSocket</text>

  <!-- Node 2: FastAPI Gateway Engine -->
  <g transform="translate(320, 60)">
    <rect width="210" height="115" rx="8" fill="#0b1329" stroke="url(#nodeBorderGreen)" stroke-width="1.5" />
    <text x="105" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#22c55e">◈ FastAPI Engine</text>
    <text x="105" y="56" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Async ASGI Microservice</text>
    <text x="105" y="76" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">• Non-blocking Event Bus</text>
    <text x="105" y="94" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">• Docker Compose Mesh</text>
  </g>

  <!-- Connection 2: Gateway -> Room Manager (Top Right) -->
  <path d="M 530 95 L 610 80" stroke="#a855f7" stroke-width="1.8" class="stream-line" />
  <polygon points="615,79 605,75 607,85" fill="#a855f7" />

  <!-- Connection 3: Gateway -> Lexicon Engine (Bottom Right) -->
  <path d="M 530 140 L 610 155" stroke="#a855f7" stroke-width="1.8" class="stream-line" />
  <polygon points="615,156 607,150 605,160" fill="#a855f7" />

  <!-- Node 3A: In-Memory Room Core -->
  <g transform="translate(620, 52)">
    <rect width="205" height="58" rx="6" fill="#0b1329" stroke="url(#nodeBorderPurple)" stroke-width="1.2" />
    <text x="102.5" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#c084fc">⬡ In-Memory Room Core</text>
    <text x="102.5" y="44" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Lobbies • Nicknames • State Sync</text>
  </g>

  <!-- Node 3B: Lexicon & Board Solver -->
  <g transform="translate(620, 126)">
    <rect width="205" height="58" rx="6" fill="#0b1329" stroke="url(#nodeBorderPurple)" stroke-width="1.2" />
    <text x="102.5" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#c084fc">⬢ 2D Board Generator</text>
    <text x="102.5" y="44" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Lexicon Matrix • Word Validation</text>
  </g>

</svg>
