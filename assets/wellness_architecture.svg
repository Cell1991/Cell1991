<svg width="100%" height="100%" viewBox="0 0 860 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wellBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b18" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="indigoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="emeraldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="amberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <style>
      @keyframes pulseData {
        to {
          stroke-dashoffset: -20;
        }
      }
      .data-stream {
        stroke-dasharray: 6, 4;
        animation: pulseData 1s linear infinite;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="860" height="200" rx="12" fill="url(#wellBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Window Bar -->
  <rect x="0" y="0" width="860" height="34" rx="12" fill="#0f172a" />
  <circle cx="20" cy="17" r="4.5" fill="#ef4444" />
  <circle cx="36" cy="17" r="4.5" fill="#f59e0b" />
  <circle cx="52" cy="17" r="4.5" fill="#22c55e" />
  <text x="74" y="21" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#cbd5e1">ENTERPRISE 3NF RELATIONAL SCHEMA &amp; TELEMETRY ARCHITECTURE</text>

  <!-- Node 1: Next.js + TS UI -->
  <g transform="translate(25, 55)">
    <rect width="170" height="120" rx="8" fill="#0b1329" stroke="url(#cyanBorder)" stroke-width="1.5" />
    <text x="85" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#00f2fe">💻 Next.js Client</text>
    <text x="85" y="55" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">TypeScript UI Layer</text>
    <text x="85" y="78" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">• Responsive Dashboard</text>
    <text x="85" y="96" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">• State &amp; Form Handling</text>
  </g>

  <!-- Connection 1 -> 2 -->
  <path d="M 195 115 L 245 115" stroke="#00f2fe" stroke-width="2" class="data-stream" />
  <polygon points="250,115 240,110 240,120" fill="#00f2fe" />

  <!-- Node 2: Prisma ORM Engine -->
  <g transform="translate(255, 55)">
    <rect width="175" height="120" rx="8" fill="#0b1329" stroke="url(#indigoBorder)" stroke-width="1.5" />
    <text x="87.5" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#818cf8">⚙️ Prisma ORM</text>
    <text x="87.5" y="55" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Data Access Layer</text>
    <text x="87.5" y="78" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">• Automated Migrations</text>
    <text x="87.5" y="96" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">• Type-Safe DB Queries</text>
  </g>

  <!-- Connection 2 -> 3 -->
  <path d="M 430 115 L 475 115" stroke="#818cf8" stroke-width="2" class="data-stream" />
  <polygon points="480,115 470,110 470,120" fill="#818cf8" />

  <!-- Node 3: PostgreSQL 3NF -->
  <g transform="translate(485, 55)">
    <rect width="185" height="120" rx="8" fill="#0b1329" stroke="url(#emeraldBorder)" stroke-width="1.5" />
    <text x="92.5" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#34d399">🗄️ PostgreSQL</text>
    <text x="92.5" y="55" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">3NF Relational Core</text>
    <text x="92.5" y="78" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">• Normalized Schemas</text>
    <text x="92.5" y="96" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">• Data Dictionary Spec</text>
  </g>

  <!-- Connection 3 -> 4 -->
  <path d="M 670 115 L 710 115" stroke="#34d399" stroke-width="2" class="data-stream" />
  <polygon points="715,115 705,110 705,120" fill="#34d399" />

  <!-- Node 4: Telemetry Monitor -->
  <g transform="translate(715, 55)">
    <rect width="125" height="120" rx="8" fill="#0b1329" stroke="url(#amberBorder)" stroke-width="1.5" />
    <text x="62.5" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#fbbf24">📊 Telemetry</text>
    <text x="62.5" y="55" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Health Cockpit</text>
    <text x="62.5" y="78" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">• Pool Status</text>
    <text x="62.5" y="96" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">• Query Latency</text>
  </g>

</svg>
