<svg width="100%" height="100%" viewBox="0 0 860 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dragon Glow Gradients -->
    <linearGradient id="d1SpineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="d1FinGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="d1HornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="d1Glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="d1SparkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes dragonGlide1 {
        0%, 100% { transform: translateY(0px) scaleY(1); }
        50% { transform: translateY(-5px) scaleY(1.04); }
      }
      @keyframes whiskerWave {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(4deg); }
      }
      @keyframes orbPulse {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 8px #00f2fe); }
      }
      @keyframes stardustFloat {
        0% { transform: translateX(0px); opacity: 0.3; }
        50% { opacity: 0.9; }
        100% { transform: translateX(20px); opacity: 0.2; }
      }

      .dragon-glide-1 {
        animation: dragonGlide1 6s ease-in-out infinite;
      }
      .whisker-anim {
        transform-origin: 750px 35px;
        animation: whiskerWave 3s ease-in-out infinite;
      }
      .orb-anim {
        animation: orbPulse 2.5s ease-in-out infinite;
      }
      .stardust-1 {
        animation: stardustFloat 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Cyber Rift Subtle Track -->
  <path d="M 40 35 Q 240 55 440 32 T 820 35" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 6" stroke-opacity="0.4" />

  <g class="dragon-glide-1">
    <!-- Serpentine Dragon Body Flow (Flowing from Left to Right) -->
    <!-- Underbelly Glow Ribbon -->
    <path d="M 40 35 Q 240 58 440 30 Q 640 10 750 35" fill="none" stroke="url(#d1SpineGrad)" stroke-width="7" stroke-linecap="round" filter="url(#d1Glow)" />
    <!-- Core Laser Spine -->
    <path d="M 40 35 Q 240 58 440 30 Q 640 10 750 35" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />

    <!-- Dorsal Fin Spikes (ครีบหลังมังกรเรืองแสง) -->
    <!-- Segment 1 Fins -->
    <polygon points="160,42 170,22 176,44" fill="url(#d1FinGrad)" />
    <polygon points="210,47 222,25 228,48" fill="url(#d1FinGrad)" />
    <polygon points="260,46 274,22 280,45" fill="url(#d1FinGrad)" />
    <!-- Segment 2 Fins -->
    <polygon points="340,36 354,14 360,34" fill="url(#d1FinGrad)" />
    <polygon points="400,28 416,6 422,26" fill="url(#d1FinGrad)" />
    <polygon points="470,20 488,-2 494,18" fill="url(#d1FinGrad)" />
    <!-- Segment 3 Fins -->
    <polygon points="560,16 576,0 582,18" fill="url(#d1FinGrad)" />
    <polygon points="630,20 644,6 650,24" fill="url(#d1FinGrad)" />
    <polygon points="690,28 702,16 708,32" fill="url(#d1FinGrad)" />

    <!-- Dragon Scales Light Beads (เกล็ดพลังงานแสง) -->
    <g fill="#00f2fe" filter="url(#d1SparkGlow)">
      <circle cx="120" cy="38" r="2" />
      <circle cx="190" cy="45" r="2.2" />
      <circle cx="270" cy="45" r="2.2" />
      <circle cx="360" cy="34" r="2.5" />
      <circle cx="450" cy="24" r="2.5" />
      <circle cx="540" cy="18" r="2.2" />
      <circle cx="630" cy="22" r="2.2" />
      <circle cx="700" cy="30" r="2" />
    </g>

    <!-- ======================================================== -->
    <!-- 🐉 CYBER DRAGON HEAD & SNOUT (Right Side: x=740..820)    -->
    <!-- ======================================================== -->
    <g transform="translate(730, 15)">
      <!-- Dragon Horns (เขามังกรผลึกคริสตัล) -->
      <!-- Upper Main Horn -->
      <path d="M 22 18 Q 45 4 60 -6 Q 48 8 26 22 Z" fill="url(#d1HornGrad)" filter="url(#d1Glow)" />
      <!-- Secondary Horn -->
      <path d="M 18 20 Q 32 12 44 6 Q 34 16 22 24 Z" fill="#38bdf8" />

      <!-- Dragon Skull Armor Plates -->
      <path d="M 15 22 L 38 18 L 52 25 L 68 28 L 58 35 L 35 34 L 18 36 Z" fill="#081026" stroke="#00f2fe" stroke-width="1.2" />
      
      <!-- Dragon Eye (Glowing Piercing Amber / Cyan) -->
      <polygon points="36,24 44,22 41,27 34,27" fill="#fbbf24" filter="url(#d1SparkGlow)" />
      <circle cx="39" cy="24.5" r="1" fill="#ffffff" />

      <!-- Dragon Snout & Fangs (เขี้ยวและกรามมังกร) -->
      <path d="M 52 25 L 72 29 L 75 33 L 64 34 L 56 38 L 48 35" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <polygon points="62,34 65,39 67,34" fill="#ffffff" />

      <!-- Whisker Antennae (หนวดมังกรพริ้วไหว) -->
      <g class="whisker-anim">
        <path d="M 66 32 Q 88 28 105 15 Q 92 34 70 36" fill="none" stroke="#00f2fe" stroke-width="1.2" filter="url(#d1SparkGlow)" />
        <path d="M 64 34 Q 85 40 98 52 Q 82 44 64 37" fill="none" stroke="#38bdf8" stroke-width="1" />
      </g>

      <!-- Astral Dragon Pearl / Plasma Orb (ลูกแก้วมังกรเรืองแสง) -->
      <g transform="translate(86, 32)" class="orb-anim">
        <circle cx="0" cy="0" r="6" fill="#00f2fe" fill-opacity="0.4" filter="url(#d1Glow)" />
        <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
        <circle cx="0" cy="0" r="8" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 3" />
      </g>
    </g>
  </g>

  <!-- Floating Stardust Particles -->
  <g class="stardust-1" fill="#00f2fe">
    <circle cx="100" cy="20" r="1" opacity="0.6" />
    <circle cx="300" cy="55" r="1.2" opacity="0.8" />
    <circle cx="500" cy="12" r="0.8" opacity="0.5" />
    <circle cx="680" cy="48" r="1.4" opacity="0.9" />
  </g>
</svg>