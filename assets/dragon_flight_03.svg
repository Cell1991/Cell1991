<svg width="100%" height="100%" viewBox="0 0 860 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="d3TailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#f43f5e" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="d3FinRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <filter id="d3Glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes dragonTailSway {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-4px) rotate(-1deg); }
      }
      @keyframes flameRibbon {
        0%, 100% { opacity: 0.8; transform: scaleX(1); }
        50% { opacity: 1; transform: scaleX(1.08) scaleY(1.1); filter: drop-shadow(0 0 8px #f43f5e); }
      }
      .tail-sway {
        animation: dragonTailSway 6.5s ease-in-out infinite;
      }
      .ribbon-anim {
        transform-origin: 720px 35px;
        animation: flameRibbon 2.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <g class="tail-sway">
    <!-- Tapering Dragon Tail Spine -->
    <path d="M 40 35 Q 260 55 480 32 Q 620 18 730 35" fill="none" stroke="url(#d3TailGrad)" stroke-width="6" stroke-linecap="round" filter="url(#d3Glow)" />
    <path d="M 40 35 Q 260 55 480 32 Q 620 18 730 35" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

    <!-- Tapering Dorsal Fins -->
    <polygon points="120,41 132,23 138,43" fill="#38bdf8" />
    <polygon points="220,49 232,29 238,50" fill="#38bdf8" />
    <polygon points="320,47 332,29 338,48" fill="#818cf8" />
    <polygon points="430,38 440,22 446,37" fill="#a855f7" />
    <polygon points="540,26 550,12 556,26" fill="#c084fc" />
    <polygon points="630,22 638,10 644,23" fill="#f43f5e" />

    <!-- ======================================================== -->
    <!-- 🔥 MAJESTIC TAIL FLAME FAN / LOTUS PLUMES (x=720..830)   -->
    <!-- ======================================================== -->
    <g class="ribbon-anim">
      <!-- Main Center Flame Feather -->
      <path d="M 725 35 Q 765 20 825 35 Q 775 42 725 35 Z" fill="url(#d3FinRibbon)" filter="url(#d3Glow)" />
      <!-- Upper Flame Feather -->
      <path d="M 720 33 Q 755 8 805 15 Q 760 26 720 33 Z" fill="url(#d3FinRibbon)" opacity="0.85" />
      <!-- Lower Flame Feather -->
      <path d="M 720 37 Q 755 60 805 52 Q 760 42 720 37 Z" fill="url(#d3FinRibbon)" opacity="0.85" />
      <!-- Top Whisp -->
      <path d="M 715 30 Q 740 -2 780 2 Q 745 18 715 30 Z" fill="#00f2fe" opacity="0.7" />
      <!-- Bottom Whisp -->
      <path d="M 715 40 Q 740 70 780 66 Q 745 50 715 40 Z" fill="#f59e0b" opacity="0.7" />
    </g>

    <!-- Trailing Nebula Embers -->
    <g fill="#f59e0b" filter="url(#d3Glow)">
      <circle cx="780" cy="24" r="1.5" />
      <circle cx="810" cy="42" r="1.8" />
      <circle cx="830" cy="30" r="1.2" />
      <circle cx="845" cy="38" r="1.5" />
      <circle cx="795" cy="58" r="1.3" />
    </g>
  </g>
</svg>